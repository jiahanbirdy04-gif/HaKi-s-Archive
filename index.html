<script>
(function () {

  // ---------- Actors Sync (auto-aggregated from every title's cast) ----------

  function normActorKey(c) {
    var n = (c.actorRealName || c.roleName || "").trim().toLowerCase();
    return n;
  }

  function normInsta(v) {
    var t = (v || "").trim().toLowerCase().replace(/^@/, "");
    if (/^n\/?a$/i.test(t)) return ""; // "N/A" is a placeholder, never a real match key
    return t;
  }

  function buildActorIndex() {
    // Groups every cast entry across every title into one actor, even if the name is
    // spelled slightly differently between titles — as long as they share the same
    // Instagram handle (a much more reliable identity signal) or the exact same name,
    // they're merged into a single row. Returns { actors: [...], conflicts: [...] }
    var entries = [];
    state.titles.forEach(function (t) {
      (t.cast || []).forEach(function (c) {
        var key = normActorKey(c);
        if (!key) return;
        entries.push({
          titleId: t.id, titleName: t.title || t.nativeTitle || "Untitled",
          castId: c.id, roleName: c.roleName, actorRealName: c.actorRealName,
          birthday: c.birthday, instagram: c.instagram, picture: c.picture,
          nameKey: key, instaKey: normInsta(c.instagram)
        });
      });
    });

    // Union-Find: merge any two entries that share a nameKey OR an instaKey.
    var parent = entries.map(function (_, i) { return i; });
    function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
    function union(a, b) { var ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; }

    var nameFirst = {}, instaFirst = {};
    entries.forEach(function (e, i) {
      if (e.nameKey) {
        if (nameFirst[e.nameKey] !== undefined) union(i, nameFirst[e.nameKey]);
        else nameFirst[e.nameKey] = i;
      }
      if (e.instaKey) {
        if (instaFirst[e.instaKey] !== undefined) union(i, instaFirst[e.instaKey]);
        else instaFirst[e.instaKey] = i;
      }
    });

    var groups = {};
    entries.forEach(function (e, i) {
      var root = find(i);
      if (!groups[root]) groups[root] = [];
      groups[root].push(e);
    });

    var actors = [];
    var conflicts = [];

    Object.keys(groups).forEach(function (root) {
      var groupEntries = groups[root];
      var displayName = mostCommon(groupEntries.map(function (e) { return e.actorRealName; }).filter(Boolean))
        || groupEntries[0].roleName;
      var picture = groupEntries.map(function (e) { return e.picture; }).filter(Boolean)[0] || "";

      var birthdays = uniqueNonEmpty(groupEntries.map(function (e) { return e.birthday; }));
      var instas = uniqueNonEmpty(groupEntries.map(function (e) { return e.instagram; }), true);
      var names = uniqueNonEmpty(groupEntries.map(function (e) { return e.actorRealName; }));

      var conflictFields = [];
      if (birthdays.length > 1) conflictFields.push({ field: "Birthday", values: birthdays });
      if (instas.length > 1) conflictFields.push({ field: "Instagram", values: instas });
      if (names.length > 1) conflictFields.push({ field: "Real/Stage Name spelling", values: names });

      if (conflictFields.length) {
        conflicts.push({ key: root, displayName: displayName, entries: groupEntries, conflictFields: conflictFields });
      }

      actors.push({
        key: root,
        name: displayName,
        picture: picture,
        birthday: birthdays[0] || "",
        instagram: instas[0] || "",
        titles: uniqueNonEmpty(groupEntries.map(function (e) { return e.titleName; })),
        roles: dedupeRoles(groupEntries),
        hasConflict: conflictFields.length > 0,
        firstTitleId: groupEntries[0].titleId,
        firstCastId: groupEntries[0].castId
      });
    });

    return { actors: actors, conflicts: conflicts };
  }

  function mostCommon(arr) {
    if (!arr.length) return "";
    var counts = {};
    arr.forEach(function (v) { counts[v] = (counts[v] || 0) + 1; });
    var best = arr[0], bestCount = 0;
    Object.keys(counts).forEach(function (v) {
      if (counts[v] > bestCount) { best = v; bestCount = counts[v]; }
    });
    return best;
  }

  function dedupeRoles(entries) {
    var seen = {}; var out = [];
    entries.forEach(function (e) {
      var k = (e.titleName || "").toLowerCase() + "|" + (e.roleName || "").toLowerCase();
      if (seen[k]) return;
      seen[k] = true;
      out.push({ titleName: e.titleName, roleName: e.roleName });
    });
    return out;
  }

  function uniqueNonEmpty(arr, isInsta) {
    var seen = {}; var out = [];
    arr.forEach(function (v) {
      var t = (v || "").trim();
      if (!t) return;
      var k = isInsta ? normInsta(t) : t.toLowerCase();
      if (seen[k]) return;
      seen[k] = true;
      out.push(t);
    });
    return out;
  }

  function daysUntilNextBirthday(birthday) {
    var b = new Date(birthday);
    if (isNaN(b)) return null;
    var now = new Date();
    var next = new Date(now.getFullYear(), b.getMonth(), b.getDate());
    next.setHours(0,0,0,0);
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (next < today) next.setFullYear(next.getFullYear() + 1);
    return Math.round((next - today) / 86400000);
  }

  function instagramLinkHTML(handle) {
    var raw = (handle || "").trim();
    if (/^n\/?a$/i.test(raw)) {
      return '<span class="insta-link" style="cursor:default;opacity:0.7">🚫 N/A</span>';
    }
    var url, icon, display;
    if (/^https?:\/\//i.test(raw)) {
      url = raw;
      display = raw.replace(/^https?:\/\//i, "");
      icon = /twitter\.com|x\.com/i.test(raw) ? "🐦" : /instagram\.com/i.test(raw) ? "📷" : "🔗";
    } else if (/^(twitter|x):/i.test(raw)) {
      var tHandle = raw.replace(/^(twitter|x):/i, "").replace(/^@/, "").trim();
      url = "https://twitter.com/" + tHandle;
      icon = "🐦";
      display = "@" + tHandle;
    } else {
      var iHandle = raw.replace(/^@/, "").trim();
      url = "https://instagram.com/" + iHandle;
      icon = "📷";
      display = raw;
    }
    return '<a href="' + url + '" target="_blank" rel="noopener" class="insta-link" onclick="event.stopPropagation()">' + icon + " " + esc(display) + "</a>";
  }

  function parseHighlightLines(text) {
    if (!text) return [];
    return text.split("\n").map(function (line) {
      line = line.trim();
      if (!line) return null;
      var sepIdx = line.indexOf("—");
      if (sepIdx === -1) sepIdx = line.indexOf(" - ");
      if (sepIdx === -1) return { title: line, desc: "" };
      var sepLen = line.charAt(sepIdx) === "—" ? 1 : 3;
      return { title: line.slice(0, sepIdx).trim(), desc: line.slice(sepIdx + sepLen).trim() };
    }).filter(Boolean);
  }

  function getDraftCast(id) { return state.formCast.filter(function (c) { return c.id === id; })[0]; }

  function findKnownActorInfo(name) {
    var key = (name || "").trim().toLowerCase();
    if (!key) return null;
    for (var i = 0; i < state.titles.length; i++) {
      var cast = state.titles[i].cast || [];
      for (var j = 0; j < cast.length; j++) {
        var c = cast[j];
        if ((c.actorRealName || "").trim().toLowerCase() === key) {
          if (c.birthday || c.instagram) {
            return { birthday: c.birthday || "", instagram: c.instagram || "" };
          }
        }
      }
    }
    return null;
  }

  // ---------- Event wiring ----------

  function wireEvents() {
    var root = document.getElementById("root");

    root.querySelectorAll("[data-nav]").forEach(function (el) {
      el.addEventListener("click", function () { state.page = el.getAttribute("data-nav"); render(); });
    });

    root.querySelectorAll("[data-actor-sort]").forEach(function (el) {
      el.addEventListener("click", function () {
        state.actorSort = el.getAttribute("data-actor-sort");
        render();
      });
    });

    var shuffleEl = root.querySelector("[data-action='shuffle-quote']");
    if (shuffleEl) shuffleEl.addEventListener("click", function () {
      state.quote = QUOTES[Math.floor(Math.random() * QUOTES.length)];
      render();
    });

    function goToAdjacentChar(delta) {
      var idx = -1;
      for (var i = 0; i < state.characters.length; i++) { if (state.characters[i].id === state.selectedCharId) { idx = i; break; } }
      if (idx === -1) return;
      var newIdx = idx + delta;
      if (newIdx < 0 || newIdx >= state.characters.length) return;
      state.selectedCharId = state.characters[newIdx].id;
      render();
    }
    function goToAdjacentCast(delta) {
      var t = getTitle(state.selectedCastTitleId);
      if (!t || !t.cast) return;
      var idx = -1;
      for (var i = 0; i < t.cast.length; i++) { if (t.cast[i].id === state.selectedCastId) { idx = i; break; } }
      if (idx === -1) return;
      var newIdx = idx + delta;
      if (newIdx < 0 || newIdx >= t.cast.length) return;
      state.selectedCastId = t.cast[newIdx].id;
      render();
    }

    var prevCharBtn = root.querySelector("[data-action='prev-char']");
    if (prevCharBtn) prevCharBtn.addEventListener("click", function () { goToAdjacentChar(-1); });
    var nextCharBtn = root.querySelector("[data-action='next-char']");
    if (nextCharBtn) nextCharBtn.addEventListener("click", function () { goToAdjacentChar(1); });
    var prevCastBtn = root.querySelector("[data-action='prev-cast']");
    if (prevCastBtn) prevCastBtn.addEventListener("click", function () { goToAdjacentCast(-1); });
    var nextCastBtn = root.querySelector("[data-action='next-cast']");
    if (nextCastBtn) nextCastBtn.addEventListener("click", function () { goToAdjacentCast(1); });

    var swipeEl = root.querySelector(".swipe-nav");
    if (swipeEl) {
      var swipeMode = swipeEl.getAttribute("data-swipe-mode");
      var touchStartX = null, touchStartY = null;
      swipeEl.addEventListener("touchstart", function (e) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }, { passive: true });
      swipeEl.addEventListener("touchend", function (e) {
        if (touchStartX === null) return;
        var dx = e.changedTouches[0].clientX - touchStartX;
        var dy = e.changedTouches[0].clientY - touchStartY;
        touchStartX = null;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
          var delta = dx < 0 ? 1 : -1;
          if (swipeMode === "char") goToAdjacentChar(delta);
          else if (swipeMode === "cast") goToAdjacentCast(delta);
        }
      }, { passive: true });
    }

    root.querySelectorAll("[data-open-title]").forEach(function (el) {
      el.addEventListener("click", function () {
        state.selectedId = el.getAttribute("data-open-title");
        state.page = "detail";
        render();
      });
    });
    root.querySelectorAll("[data-open-char]").forEach(function (el) {
      el.addEventListener("click", function () {
        state.selectedCharId = el.getAttribute("data-open-char");
        state.page = "charDetail";
        render();
      });
    });
    root.querySelectorAll("[data-open-cast]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        if (suppressNextCardClick) { suppressNextCardClick = false; return; }
        state.selectedCastTitleId = el.getAttribute("data-cast-title-id");
        state.selectedCastId = el.getAttribute("data-open-cast");
        state.page = "castDetail";
        render();
      });
    });
    root.querySelectorAll("[data-nav-title]").forEach(function (el) {
      el.addEventListener("click", function () {
        state.selectedId = el.getAttribute("data-nav-title");
        state.page = "detail";
        render();
      });
    });

    root.querySelectorAll("[data-toggle]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        var id = el.getAttribute("data-id");
        var field = el.getAttribute("data-toggle");
        var t = getTitle(id);
        if (t) { t[field] = !t[field]; persistTitles(); render(); }
      });
    });

    var newTitleBtn = root.querySelector("[data-action='new-title']");
    if (newTitleBtn) newTitleBtn.addEventListener("click", function () {
      state.editingTitleId = null;
      state.formBadges = [];
      state.formCast = [];
      state.formGallery = [];
      state.formVideos = [];
      state.showForm = true;
      render();
    });
    var newCharBtn = root.querySelector("[data-action='new-char']");
    if (newCharBtn) newCharBtn.addEventListener("click", function () {
      state.editingCharId = null;
      state.showCharForm = true;
      render();
    });

    var newDiaryBtn = root.querySelector("[data-action='new-diary']");
    if (newDiaryBtn) newDiaryBtn.addEventListener("click", function () {
      state.editingDiaryId = null;
      state.showDiaryForm = true;
      render();
    });
    var diaryPinSubmitBtn = root.querySelector("#diaryPinSubmitBtn");
    if (diaryPinSubmitBtn) {
      wirePasswordToggles(root);
      diaryPinSubmitBtn.addEventListener("click", function () {
        var hasPin = !!getDiaryPin();
        var mode = !hasPin ? "setup" : (!state.diaryUnlocked ? "unlock" : "change");
        var pinInput = document.getElementById("diaryPinInput").value;
        var errEl = document.getElementById("diaryPinError");
        if (mode === "unlock") {
          if (pinInput === getDiaryPin()) {
            state.diaryUnlocked = true;
            try { sessionStorage.setItem(DIARY_UNLOCKED_KEY, "1"); } catch (e) {}
            render();
          } else if (errEl) {
            errEl.textContent = "Incorrect password.";
          }
        } else {
          var confirmInput = document.getElementById("diaryPinConfirm").value;
          if (!pinInput) { if (errEl) errEl.textContent = "Password can't be empty."; return; }
          if (pinInput !== confirmInput) { if (errEl) errEl.textContent = "Passwords don't match."; return; }
          try { localStorage.setItem(DIARY_PIN_KEY, pinInput); } catch (e) {}
          state.diaryUnlocked = true;
          state.forceDiaryLockScreen = false;
          try { sessionStorage.setItem(DIARY_UNLOCKED_KEY, "1"); } catch (e) {}
          render();
        }
      });
    }
    var diaryPinCancelBtn = root.querySelector("#diaryPinCancelBtn");
    if (diaryPinCancelBtn) diaryPinCancelBtn.addEventListener("click", function () {
      state.forceDiaryLockScreen = false;
      render();
    });
    var setupDiaryPasswordBtn = root.querySelector("[data-action='setup-diary-password']");
    if (setupDiaryPasswordBtn) setupDiaryPasswordBtn.addEventListener("click", function () {
      state.forceDiaryLockScreen = true;
      render();
    });
    var lockDiaryLink = root.querySelector("[data-action='lock-diary']");
    if (lockDiaryLink) lockDiaryLink.addEventListener("click", function () {
      state.diaryUnlocked = false;
      try { sessionStorage.removeItem(DIARY_UNLOCKED_KEY); } catch (e) {}
      render();
    });
    root.querySelectorAll("[data-open-diary]").forEach(function (el) {
      el.addEventListener("click", function () {
        state.selectedDiaryId = el.getAttribute("data-open-diary");
        state.page = "diaryDetail";
        render();
      });
    });
    root.querySelectorAll("[data-action='edit-diary']").forEach(function (el) {
      el.addEventListener("click", function () {
        state.editingDiaryId = el.getAttribute("data-id");
        state.showDiaryForm = true;
        render();
      });
    });
    root.querySelectorAll("[data-action='delete-diary']").forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-id");
        var e = getDiaryEntry(id);
        if (!confirm('Delete "' + (e ? (e.title || "this entry") : "this entry") + '"? This cannot be undone.')) return;
        state.diaryEntries = state.diaryEntries.filter(function (x) { return x.id !== id; });
        persistDiary();
        state.page = "diary";
        render();
      });
    });
    root.querySelectorAll("[data-action='close-diary-form']").forEach(function (el) {
      el.addEventListener("click", function () { state.showDiaryForm = false; render(); });
    });
    var saveDiaryBtn = root.querySelector("[data-action='save-diary']");
    if (saveDiaryBtn) saveDiaryBtn.addEventListener("click", function () {
      var val = function (id) { var e = document.getElementById(id); return e ? e.value : ""; };
      var data = {
        date: val("diary-date"),
        title: val("diary-title"),
        photo: val("diary-photo"),
        text: val("diary-text")
      };
      if (state.editingDiaryId) {
        var existing = getDiaryEntry(state.editingDiaryId);
        if (existing) Object.keys(data).forEach(function (k) { existing[k] = data[k]; });
      } else {
        data.id = uid();
        data.createdAt = Date.now();
        state.diaryEntries.unshift(data);
      }
      persistDiary();
      state.showDiaryForm = false;
      render();
    });

    root.querySelectorAll("[data-action='edit-title']").forEach(function (el) {
      el.addEventListener("click", function () {
        var t = getTitle(el.getAttribute("data-id"));
        state.editingTitleId = t.id;
        state.formBadges = (t.badges || []).slice();
        state.formCast = (t.cast || []).map(function (c) { return Object.assign({}, c); });
        state.formGallery = (t.gallery || []).slice();
        state.formVideos = (t.videos || []).slice();
        state.showForm = true;
        render();
      });
    });
    root.querySelectorAll("[data-action='delete-title']").forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-id");
        var t = getTitle(id);
        if (!confirm('Delete "' + (t ? t.title : "this title") + '"? This cannot be undone.')) return;
        state.titles = state.titles.filter(function (x) { return x.id !== id; });
        persistTitles();
        state.page = "archive";
        render();
      });
    });
    root.querySelectorAll("[data-action='edit-char']").forEach(function (el) {
      el.addEventListener("click", function () {
        state.editingCharId = el.getAttribute("data-id");
        state.showCharForm = true;
        render();
      });
    });
    root.querySelectorAll("[data-action='delete-char']").forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-id");
        var c = getChar(id);
        if (!confirm('Remove "' + (c ? c.characterName : "this favorite") + '"? This cannot be undone.')) return;
        state.characters = state.characters.filter(function (x) { return x.id !== id; });
        persistCharacters();
        state.page = "characters";
        render();
      });
    });

    var newCastBtn = root.querySelector("[data-action='new-cast']");
    if (newCastBtn) newCastBtn.addEventListener("click", function () {
      state.castFormTitleId = newCastBtn.getAttribute("data-title-id");
      state.editingCastId = null;
      state.castDraftMode = false;
      state.showCastForm = true;
      render();
    });
    var toggleCastReorderBtn = root.querySelector("[data-action='toggle-cast-reorder']");
    if (toggleCastReorderBtn) toggleCastReorderBtn.addEventListener("click", function () {
      state.castReorderMode = !state.castReorderMode;
      if (state.showForm) renderPreserveForm(); else render();
    });

    var newCastDraftBtn = root.querySelector("[data-action='new-cast-draft']");
    if (newCastDraftBtn) newCastDraftBtn.addEventListener("click", function () {
      state.editingCastId = null;
      state.editingCastDraftId = null;
      state.castDraftMode = true;
      state.showCastForm = true;
      renderPreserveForm();
    });
    root.querySelectorAll("[data-edit-cast-draft]").forEach(function (el) {
      el.addEventListener("click", function () {
        if (suppressNextCardClick) { suppressNextCardClick = false; return; }
        state.editingCastDraftId = el.getAttribute("data-edit-cast-draft");
        state.castDraftMode = true;
        state.showCastForm = true;
        renderPreserveForm();
      });
    });
    root.querySelectorAll("[data-action='remove-cast-draft']").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        var id = el.getAttribute("data-cast-draft-id");
        state.formCast = state.formCast.filter(function (c) { return c.id !== id; });
        renderPreserveForm();
      });
    });
    root.querySelectorAll("[data-action='edit-cast']").forEach(function (el) {
      el.addEventListener("click", function () {
        state.castFormTitleId = el.getAttribute("data-title-id");
        state.editingCastId = el.getAttribute("data-id");
        state.castDraftMode = false;
        state.showCastForm = true;
        render();
      });
    });
    root.querySelectorAll("[data-action='delete-cast']").forEach(function (el) {
      el.addEventListener("click", function () {
        var titleId = el.getAttribute("data-title-id");
        var castId = el.getAttribute("data-id");
        var t = getTitle(titleId);
        var c = t ? getCast(titleId, castId) : null;
        if (!confirm('Remove "' + (c ? (c.roleName || c.actorRealName) : "this character") + '"? This cannot be undone.')) return;
        if (t && t.cast) t.cast = t.cast.filter(function (x) { return x.id !== castId; });
        persistTitles();
        state.selectedId = titleId;
        state.page = "detail";
        render();
      });
    });

    root.querySelectorAll("[data-action='close-form']").forEach(function (el) {
      el.addEventListener("click", function () { state.showForm = false; render(); });
    });
    root.querySelectorAll("[data-action='close-char-form']").forEach(function (el) {
      el.addEventListener("click", function () { state.showCharForm = false; render(); });

    function enableDragReorder(gridEl, getArray, afterDrop) {
      if (!gridEl) return;
      var HOLD_MS = 160;
      var CANCEL_PX = 10;

      gridEl.querySelectorAll(".drag-handle").forEach(function (handle) {
        handle.addEventListener("click", function (e) { e.stopPropagation(); });
        handle.addEventListener("contextmenu", function (e) { e.preventDefault(); e.stopPropagation(); });
        handle.addEventListener("pointerdown", function (e) {
          e.preventDefault();
          e.stopPropagation();
          var card = handle.closest(".cast-card");
          if (!card) return;
          var startX = e.clientX, startY = e.clientY;
          var pointerId = e.pointerId;
          var active = false;

          var holdTimer = setTimeout(function () {
            active = true;
            card.classList.add("dragging-card");
            try { handle.setPointerCapture(pointerId); } catch (err) {}
          }, HOLD_MS);

          function onMove(ev) {
            if (!active) {
              if (Math.abs(ev.clientX - startX) > CANCEL_PX || Math.abs(ev.clientY - startY) > CANCEL_PX) {
                clearTimeout(holdTimer);
                window.removeEventListener("pointermove", onMove);
                window.removeEventListener("pointerup", onUp);
              }
              return;
            }
            if (ev.cancelable) ev.preventDefault();
            var x = ev.clientX, y = ev.clientY;
            var siblings = Array.prototype.filter.call(gridEl.children, function (el) { return el !== card; });
            for (var i = 0; i < siblings.length; i++) {
              var rect = siblings[i].getBoundingClientRect();
              if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
                var cardPos = Array.prototype.indexOf.call(gridEl.children, card);
                var targetPos = Array.prototype.indexOf.call(gridEl.children, siblings[i]);
                if (targetPos < cardPos) gridEl.insertBefore(card, siblings[i]);
                else gridEl.insertBefore(card, siblings[i].nextSibling);
                break;
              }
            }
          }
          function onUp() {
            clearTimeout(holdTimer);
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onUp);
            if (!active) return;
            card.classList.remove("dragging-card");
            var newOrderIds = Array.prototype.map.call(gridEl.children, function (el) { return el.getAttribute("data-cast-id"); });
            var arr = getArray();
            if (arr) {
              var byId = {};
              arr.forEach(function (item) { byId[item.id] = item; });
              var newArr = newOrderIds.map(function (id) { return byId[id]; }).filter(Boolean);
              arr.length = 0;
              newArr.forEach(function (item) { arr.push(item); });
            }
            afterDrop();
          }
          window.addEventListener("pointermove", onMove, { passive: false });
          window.addEventListener("pointerup", onUp);
        }, { passive: true });
      });
    }

  function exportFullBackup() {
    var TITLES_PER_CHUNK = 1;
    var titleChunks = [];
    for (var i = 0; i < state.titles.length; i += TITLES_PER_CHUNK) {
      titleChunks.push(state.titles.slice(i, i + TITLES_PER_CHUNK));
    }
    if (titleChunks.length === 0) titleChunks = [[]];
    var totalParts = titleChunks.length;
    var dateStr = new Date().toISOString().slice(0, 10);

    // Lightweight descriptors only — no JSON.stringify or Blob built yet.
    var parts = titleChunks.map(function (chunk, idx) {
      var nameLabel = (chunk[0] && (chunk[0].title || chunk[0].nativeTitle)) || ("part" + (idx + 1));
      var safeName = nameLabel.replace(/[^a-z0-9]+/gi, "-").replace(/^-+|-+$/g, "").slice(0, 40) || ("part" + (idx + 1));
      return {
        titleRefs: chunk,
        includeExtras: idx === 0,
        filename: safeName + ".json",
        downloaded: false
      };
    });

    try { localStorage.setItem(LAST_BACKUP_KEY, new Date().toISOString()); } catch (e) {}
    state.backupParts = parts;
    state.showBackupModal = true;
    render();
  }

  function buildBackupPartBlob(part, totalParts, partNum) {
    var payload = {
      appVersion: "haki-archive-backup-v1",
      exportedAt: new Date().toISOString(),
      part: partNum, totalParts: totalParts,
      titles: part.titleRefs,
      characters: part.includeExtras ? state.characters : [],
      diaryEntries: part.includeExtras ? state.diaryEntries : []
    };
    var json = JSON.stringify(payload);
    var blob = new Blob([json], { type: "application/json" });
    payload = null; json = null;
    return blob;
  }

  function buildAndDownloadBackupPart(part, totalParts, partNum) {
    var blob = buildBackupPartBlob(part, totalParts, partNum);
    downloadBackupFile(blob, part.filename);
    blob = null;
  }

  function shareAllBackupParts(onProgress) {
    var parts = state.backupParts || [];
    var files = [];
    var idx = 0;
    function next() {
      if (idx >= parts.length) return Promise.resolve(files);
      var p = parts[idx];
      var blob = buildBackupPartBlob(p, parts.length, idx + 1);
      var file = null;
      try { file = new File([blob], p.filename, { type: "application/json" }); } catch (e) {}
      if (file) files.push(file);
      p.downloaded = true;
      idx++;
      if (onProgress) onProgress(idx, parts.length);
      return new Promise(function (r) { setTimeout(r, 30); }).then(next);
    }
    return next().then(function () {
      return navigator.share({
        files: files,
        title: "Haki's Archive Backup",
        text: "My drama archive backup (" + files.length + " file" + (files.length > 1 ? "s" : "") + ") — save all of them somewhere safe together."
      });
    });
  }

  function downloadBackupFile(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function importFullBackup(file) {
    var reader = new FileReader();
    reader.onload = function (ev) {
      var parsed;
      try {
        parsed = JSON.parse(ev.target.result);
      } catch (e) {
        alert("That doesn't look like a valid backup file.");
        return;
      }
      var hasTitles = parsed && Array.isArray(parsed.titles);
      var hasCastUpdates = parsed && Array.isArray(parsed.titleCastUpdates);
      if (!hasTitles && !hasCastUpdates) {
        alert("That doesn't look like a valid Haki's Archive file.");
        return;
      }
      showImportChoiceModal(parsed);
    };
    reader.onerror = function () { alert("Could not read that file. Try again."); };
    reader.readAsText(file);
  }

  function showImportChoiceModal(parsed) {
    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    var titleCount = (parsed.titles || []).length;
    var charCount = (parsed.characters || []).length;

    if (titleCount || charCount || diaryCount) {
      summary += "This file has " + titleCount + " title(s), " + charCount + " favorite(s), and " + diaryCount + " diary entr(y/ies). ";
    }
    if (castUpdateTitles) {

    }

      buttons += '<button class="save-btn" id="importChoiceMerge" style="width:100%;margin-bottom:10px">➕ Add to My Existing Archive</button>';
    }

      buttons += '<button class="save-btn" id="importChoiceCastUpdate" style="width:100%;margin-bottom:10px">🔄 Update Existing Titles\' Characters</button>';
    }

      buttons += '<button class="cancel-btn" id="importChoiceReplace" style="width:100%;margin-bottom:10px">🔁 Replace Everything</button>';
    }

      '<div class="modal" style="max-width:400px" onclick="event.stopPropagation()">' +

      '<p style="color:#786646;font-size:13px;margin-bottom:18px">' + summary + ' What do you want to do?</p>' +
      buttons +

    document.body.appendChild(overlay);
    overlay.addEventListener("click", function (e) { if (e.target === overlay) overlay.remove(); });
    document.getElementById("importChoiceCancel").addEventListener("click", function () { overlay.remove(); });
    document.getElementById("importChoiceCancel2").addEventListener("click", function () { overlay.remove(); });
    var mergeBtn = document.getElementById("importChoiceMerge");
    if (mergeBtn) mergeBtn.addEventListener("click", function () {
      overlay.remove();
      mergeImportedData(parsed);
    });
    var castUpdateBtn = document.getElementById("importChoiceCastUpdate");
    if (castUpdateBtn) castUpdateBtn.addEventListener("click", function () {
      overlay.remove();

    });

  function autofillFromKnownActor(c) {
    if (!c.actorRealName || (c.birthday && c.instagram)) return;
    var info = findKnownActorInfo(c.actorRealName);
    if (!info) return;
    if (!c.birthday && info.birthday) c.birthday = info.birthday;
    if (!c.instagram && info.instagram) c.instagram = info.instagram;
  }

  function applyTitleCastUpdates(titleCastUpdates) {
    var updatedCount = 0, addedCount = 0, notFoundTitles = [], notFoundRoles = [];
    (titleCastUpdates || []).forEach(function (entry) {
      var t = state.titles.filter(function (x) {
        return (x.title || "").trim().toLowerCase() === (entry.titleName || "").trim().toLowerCase();
      })[0];
      if (!t) { notFoundTitles.push(entry.titleName); return; }
      if (!t.cast) t.cast = [];
      (entry.updates || []).forEach(function (u) {
        var c = t.cast.filter(function (x) {
          return (x.roleName || x.actorRealName || "").trim().toLowerCase() === (u.roleName || "").trim().toLowerCase();
        })[0];
        if (!c) { notFoundRoles.push(entry.titleName + ": " + u.roleName); return; }
        if (u.actorRealName) c.actorRealName = u.actorRealName;
        if (u.instagram) c.instagram = u.instagram;
        if (u.birthday) c.birthday = u.birthday;
        if (u.background) c.background = u.background;
        if (u.picture) c.picture = u.picture;
        autofillFromKnownActor(c);
        updatedCount++;
      });
      (entry.additions || []).forEach(function (a) {
        var c = Object.assign({ id: uid(), roleName: "", actorRealName: "", birthday: "", instagram: "", picture: "", background: "" }, a);
        autofillFromKnownActor(c);
        t.cast.unshift(c);
        addedCount++;
      });
    });
    persistTitles();
    var msg = "Updated " + updatedCount + " character(s), added " + addedCount + " new one(s).";
    if (notFoundTitles.length) msg += "\n\nCouldn't find these titles in your archive: " + notFoundTitles.join(", ");
    if (notFoundRoles.length) msg += "\n\nCouldn't find these characters to update: " + notFoundRoles.join(", ");
    alert(msg);
    state.page = "archive";
    render();
  }

  function mergeCastArray(existingCast, incomingCast) {
    var byRole = {};
    existingCast.forEach(function (c, i) { byRole[(c.roleName || "").trim().toLowerCase()] = i; });
    var addedCount = 0, updatedCount = 0;
    incomingCast.forEach(function (inc) {
      var key = (inc.roleName || "").trim().toLowerCase();
      if (key && byRole[key] !== undefined) {
        var existing = existingCast[byRole[key]];
        var changed = false;
        ["actorRealName", "birthday", "instagram", "picture", "background"].forEach(function (f) {
          if (!existing[f] && inc[f]) { existing[f] = inc[f]; changed = true; }
        });
        autofillFromKnownActor(existing);
        if (changed) updatedCount++;
      } else {
        var newC = Object.assign({}, inc, { id: uid() });
        autofillFromKnownActor(newC);
        existingCast.push(newC);
        addedCount++;
      }
    });
    return { addedCount: addedCount, updatedCount: updatedCount };
  }

  function mergeImportedData(parsed) {
    var newTitles = [];
    var titlesUpdated = 0, castAdded = 0, castUpdated = 0;

    (parsed.titles || []).forEach(function (t) {
      var key = (t.title || t.nativeTitle || "").trim().toLowerCase();
      var existing = key ? state.titles.filter(function (et) {
        return (et.title || et.nativeTitle || "").trim().toLowerCase() === key;
      })[0] : null;

      if (existing) {
        Object.keys(t).forEach(function (f) {
          if (f === "cast" || f === "id") return;
          var isEmpty = existing[f] === undefined || existing[f] === null || existing[f] === "";
          if (isEmpty && t[f]) existing[f] = t[f];
        });
        if (t.cast && t.cast.length) {
          if (!existing.cast) existing.cast = [];
          var result = mergeCastArray(existing.cast, t.cast);
          castAdded += result.addedCount;
          castUpdated += result.updatedCount;
        }
        titlesUpdated++;
      } else {
        var copy = Object.assign({}, t);
        copy.id = uid();
        copy.liked = false; copy.favorited = false; copy.bookmarked = false;
        copy.comments = copy.comments || [];
        if (copy.cast) copy.cast = copy.cast.map(function (c) {
          var newC = Object.assign({}, c, { id: uid() });
          autofillFromKnownActor(newC);
          return newC;
        });
        newTitles.push(copy);
      }
    });

    var addedChars = (parsed.characters || []).map(function (c) {
      return Object.assign({}, c, { id: uid() });
    });
    var addedDiary = (parsed.diaryEntries || []).map(function (d) {
      return Object.assign({}, d, { id: uid(), createdAt: Date.now() });
    });
    state.titles = newTitles.concat(state.titles);
    state.characters = addedChars.concat(state.characters);
    state.diaryEntries = addedDiary.concat(state.diaryEntries);
    persistTitles();
    persistCharacters();
    persistDiary();
    var msg = "Added " + newTitles.length + " new title(s).";
    if (titlesUpdated) msg += " Matched and updated " + titlesUpdated + " existing title(s) — filled in " + castUpdated + " cast member('s) missing info and added " + castAdded + " new cast member(s).";
    if (addedChars.length) msg += " Added " + addedChars.length + " favorite(s).";
    if (addedDiary.length) msg += " Added " + addedDiary.length + " diary entr(y/ies).";
    alert(msg);
    state.page = "archive";
    render();
  }

  function buildReadOnlyExportHTML(onProgress) {
    var styleContent = "";
    var styleEl = document.querySelector("style");
    if (styleEl) styleContent = styleEl.textContent;

    // Gather every image that needs compressing for this export copy only —
    // this never touches the images actually saved in your archive.
    var jobs = [];
    state.titles.forEach(function (t) {
      if (t.poster) jobs.push({ get: function () { return t.poster; }, set: function (v) { t._exportPoster = v; } });
      (t.cast || []).forEach(function (c) {
        if (c.picture) jobs.push({ get: function () { return c.picture; }, set: function (v) { c._exportPic = v; } });
      });
      (t.gallery || []).forEach(function (src, i) {
        jobs.push({ get: function () { return src; }, set: function (v) { (t._exportGallery = t._exportGallery || [])[i] = v; } });
      });
    });
    state.characters.forEach(function (c) {
      if (c.picture) jobs.push({ get: function () { return c.picture; }, set: function (v) { c._exportPic = v; } });
    });

    var total = jobs.length;
    var idx = 0;
    function processNext() {
      if (idx >= total) return Promise.resolve();
      var j = jobs[idx];
      return recompressDataUrl(j.get(), 0.55).then(function (out) {
        j.set(out || j.get());
        idx++;
        if (onProgress) onProgress(idx, Math.max(total, 1));
        return new Promise(function (r) { setTimeout(r, 15); }).then(processNext);
      });
    }

    return processNext().then(function () {
      var exportData = {
        titles: state.titles.map(function (t) {
          return {
            id: t.id, title: t.title, nativeTitle: t.nativeTitle, country: t.country, year: t.year,
            type: t.type, format: t.format, status: t.status, genre: t.genre, episodes: t.episodes, runtime: t.runtime,
            rating: t.rating, watchOrder: t.watchOrder, poster: t._exportPoster || t.poster, overview: t.overview,
            review: t.review, favoriteScene: t.favoriteScene, favoriteQuote: t.favoriteQuote,
            tags: t.tags, badges: t.badges, songUrl: t.songUrl,
            cast: (t.cast || []).map(function (c) {
              return { id: c.id, roleName: c.roleName, actorRealName: c.actorRealName, birthday: c.birthday, instagram: c.instagram, picture: c._exportPic || c.picture, background: c.background };
            }),
            gallery: t._exportGallery || t.gallery || []
          };
        }),
        characters: state.characters.map(function (c) {
          return {
            id: c.id, characterName: c.characterName, drama: c.drama, birthday: c.birthday,
            instagram: c.instagram, fullName: c.fullName, height: c.height, almaMater: c.almaMater, agency: c.agency,
            picture: c._exportPic || c.picture, background: c.background, reason: c.reason,
            rolesText: c.rolesText, funFactsText: c.funFactsText
          };

      };

      // Clean up temp export-only fields so they don't linger on the live objects
      state.titles.forEach(function (t) { delete t._exportPoster; delete t._exportGallery; (t.cast || []).forEach(function (c) { delete c._exportPic; }); });
      state.characters.forEach(function (c) { delete c._exportPic; });

      var dataScript = "var DATA = " + JSON.stringify(exportData) + ";";

      var appScript = [
        "var RATING_SCALE = " + JSON.stringify(RATING_SCALE) + ";",
        "var rState = { page: 'list', query: '', typeFilter: 'All', selectedId: null, selectedCharId: null };",
        "var currentAudioId = null;",
        "function esc(s){ if(s===null||s===undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }",
        "function calcAge(b){ if(!b) return ''; var d=new Date(b); if(isNaN(d)) return ''; var n=new Date(); var a=n.getFullYear()-d.getFullYear(); var m=n.getMonth()-d.getMonth(); if(m<0||(m===0&&n.getDate()<d.getDate())) a--; return a; }",
        "function starRating(rating){ var idx=RATING_SCALE.indexOf(rating); if(idx===-1) idx=0; var filled=Math.max(1,Math.round(((idx+1)/RATING_SCALE.length)*5)); var stars=''; for(var i=0;i<5;i++) stars += (i<filled?'⭐':'☆'); return '<div class=\"rating-stars\"><span class=\"stars\">'+stars+'</span><span class=\"rating-label\">'+esc(rating)+'</span></div>'; }",
        "function getTitle(id){ return DATA.titles.filter(function(t){return t.id===id;})[0]; }",
        "function getChar(id){ return DATA.characters.filter(function(c){return c.id===id;})[0]; }",
        "function normInsta(v){ var t=(v||'').trim().toLowerCase().replace(/^@/,''); if(/^n\\/?a$/i.test(t)) return ''; return t; }",
        "function buildActorIndex(){",
        "  var entries=[];",

        "    entries.push({ titleName:t.title, roleName:c.roleName, actorRealName:c.actorRealName, birthday:c.birthday, instagram:c.instagram, picture:c.picture, nameKey:nameKey, instaKey:normInsta(c.instagram) });",

  function openLightbox(images, startIndex) {
    var idx = startIndex;
    var overlay = document.createElement("div");
    overlay.className = "lightbox-overlay";
    overlay.addEventListener("click", function (e) { if (e.target === overlay) close(); });
    document.body.appendChild(overlay);

    function close() { overlay.remove(); }
    function getDist(t1, t2) {
      var dx = t1.clientX - t2.clientX, dy = t1.clientY - t2.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function draw() {
      overlay.innerHTML = "";
      var closeBtn = document.createElement("button");
      closeBtn.className = "lightbox-close";
      closeBtn.textContent = "✕";
      closeBtn.addEventListener("click", close);
      overlay.appendChild(closeBtn);
      if (images.length > 1 && idx > 0) {
        var prevBtn = document.createElement("button");
        prevBtn.className = "lightbox-nav lightbox-prev";
        prevBtn.textContent = "‹";
        prevBtn.addEventListener("click", function (e) { e.stopPropagation(); idx--; draw(); });
        overlay.appendChild(prevBtn);
      }
      if (images.length > 1 && idx < images.length - 1) {
        var nextBtn = document.createElement("button");
        nextBtn.className = "lightbox-nav lightbox-next";
        nextBtn.textContent = "›";
        nextBtn.addEventListener("click", function (e) { e.stopPropagation(); idx++; draw(); });
        overlay.appendChild(nextBtn);
      }
      var img = document.createElement("img");
      img.src = images[idx];
      overlay.appendChild(img);

      var scale = 1, panX = 0, panY = 0;
      var pinchStartDist = null, pinchStartScale = 1;
      var dragStartX = null, dragStartY = null, dragStartPanX = 0, dragStartPanY = 0;
      var swipeStartX = null, swipeStartY = null;
      var lastTapTime = 0;

      function applyTransform() {
        img.style.transform = "translate(" + panX + "px," + panY + "px) scale(" + scale + ")";
      }

      img.addEventListener("touchstart", function (e) {
        if (e.touches.length === 2) {
          pinchStartDist = getDist(e.touches[0], e.touches[1]);
          pinchStartScale = scale;
        } else if (e.touches.length === 1) {
          dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY;
          dragStartPanX = panX; dragStartPanY = panY;
          swipeStartX = e.touches[0].clientX; swipeStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      img.addEventListener("touchmove", function (e) {
        if (e.touches.length === 2 && pinchStartDist) {
          var newDist = getDist(e.touches[0], e.touches[1]);
          scale = Math.min(4, Math.max(1, pinchStartScale * (newDist / pinchStartDist)));
          applyTransform();
        } else if (e.touches.length === 1 && scale > 1) {
          panX = dragStartPanX + (e.touches[0].clientX - dragStartX);
          panY = dragStartPanY + (e.touches[0].clientY - dragStartY);
          applyTransform();
        }
      }, { passive: true });

      img.addEventListener("touchend", function (e) {
        pinchStartDist = null;
        if (scale <= 1.05) { scale = 1; panX = 0; panY = 0; applyTransform(); }
        if (scale <= 1 && swipeStartX !== null && e.changedTouches && e.changedTouches.length) {
          var dx = e.changedTouches[0].clientX - swipeStartX;
          var dy = e.changedTouches[0].clientY - swipeStartY;
          if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
            if (dx < 0 && idx < images.length - 1) { idx++; draw(); return; }
            if (dx > 0 && idx > 0) { idx--; draw(); return; }
          } else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
            var now = Date.now();
            if (now - lastTapTime < 300) {
              scale = scale > 1 ? 1 : 2.5;
              panX = 0; panY = 0;
              applyTransform();
              lastTapTime = 0;
            } else {
              lastTapTime = now;
            }
          }
        }
        swipeStartX = null; swipeStartY = null;
      }, { passive: true });

      img.addEventListener("dblclick", function () {
        scale = scale > 1 ? 1 : 2.5;
        panX = 0; panY = 0;
        applyTransform();
      });
    }
    draw();
  }

  function recompressDataUrl(dataUrl, quality) {
    return new Promise(function (resolve) {
      if (!dataUrl || dataUrl.indexOf("data:image") !== 0) { resolve(null); return; }
      var img = new Image();
      img.onload = function () {
        try {
          var canvas = document.createElement("canvas");
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0);
          var out = canvas.toDataURL("image/jpeg", quality);
          resolve(out.length < dataUrl.length ? out : null);
        } catch (e) { resolve(null); }
      };
      img.onerror = function () { resolve(null); };
      img.src = dataUrl;
    });
  }

  function compressAllPhotos(onProgress) {
    var sources = [];
    state.titles.forEach(function (t) {
      if (t.poster) sources.push({ get: function () { return t.poster; }, set: function (v) { t.poster = v; } });
      (t.cast || []).forEach(function (c) {
        if (c.picture) sources.push({ get: function () { return c.picture; }, set: function (v) { c.picture = v; } });
      });
      (t.gallery || []).forEach(function (_, i) {
        sources.push({ get: function () { return t.gallery[i]; }, set: function (v) { t.gallery[i] = v; } });
      });
    });
    state.characters.forEach(function (c) {
      if (c.picture) sources.push({ get: function () { return c.picture; }, set: function (v) { c.picture = v; } });
    });
    (state.stickerFaces || []).forEach(function (_, i) {
      sources.push({ get: function () { return state.stickerFaces[i]; }, set: function (v) { state.stickerFaces[i] = v; } });
    });

    var total = sources.length;
    var savedBytes = 0;
    var idx = 0;

    function next() {
      if (idx >= total) return Promise.resolve({ done: true, savedBytes: savedBytes, total: total });
      var s = sources[idx];
      var before = (s.get() || "").length;
      return recompressDataUrl(s.get(), 0.72).then(function (out) {
        if (out) {
          savedBytes += Math.max(0, before - out.length);
          s.set(out);
        }
        idx++;
        if (onProgress) onProgress(idx, total);
        return new Promise(function (r) { setTimeout(r, 30); }).then(next);
      });
    }
    return next();
  }

  function openCropModal(imgSrc, aspect, onDone, onCancel, label) {
    var frameW = aspect === "portrait" ? 240 : (aspect === "landscape" ? 280 : 260);
    var frameH = aspect === "portrait" ? 320 : (aspect === "landscape" ? 190 : 260);

    var overlay = document.createElement("div");
    overlay.className = "crop-overlay";
    overlay.innerHTML =
      (label ? '<p class="crop-hint" style="margin-bottom:8px;color:#9C6B21;font-weight:700">' + label + "</p>" : "") +
      '<div class="crop-frame" id="cropFrame" style="width:' + frameW + 'px;height:' + frameH + 'px">' +
        '<img id="cropImg" src="' + imgSrc + '" alt="">' +
      '</div>' +
      '<div class="crop-controls">' +
        '<div class="crop-zoom-row"><span>🔍−</span><input type="range" id="cropZoom" min="0" max="100" value="0" style="flex:1"><span>🔍+</span></div>' +
        '<p class="crop-hint">Drag the photo to reposition. Use the slider to zoom.</p>' +
      '</div>' +
      '<div class="crop-buttons">' +
        '<button class="cancel-btn" id="cropCancelBtn" type="button">' + (onCancel ? "Skip" : "Cancel") + '</button>' +
        '<button class="save-btn" id="cropUseBtn" type="button">Use Photo</button>' +
      '</div>';
    document.body.appendChild(overlay);

    var imgEl = document.getElementById("cropImg");
    var frame = document.getElementById("cropFrame");
    var zoomSlider = document.getElementById("cropZoom");
    var naturalW, naturalH, baseScale, curScale, offsetX, offsetY, dragging = false, startX, startY, startOffX, startOffY;

    function clamp() {
      var dW = naturalW * curScale, dH = naturalH * curScale;
      var minX = frameW - dW, minY = frameH - dH;
      offsetX = Math.min(0, Math.max(minX, offsetX));
      offsetY = Math.min(0, Math.max(minY, offsetY));
    }
    function apply() {
      imgEl.style.width = (naturalW * curScale) + "px";
      imgEl.style.height = (naturalH * curScale) + "px";
      imgEl.style.transform = "translate(" + offsetX + "px," + offsetY + "px)";
    }

    var sourceImg = new Image();
    sourceImg.onload = function () {
      naturalW = sourceImg.naturalWidth;
      naturalH = sourceImg.naturalHeight;
      baseScale = Math.max(frameW / naturalW, frameH / naturalH);
      curScale = baseScale;
      offsetX = (frameW - naturalW * curScale) / 2;
      offsetY = (frameH - naturalH * curScale) / 2;
      clamp();
      apply();
    };
    sourceImg.src = imgSrc;

    zoomSlider.addEventListener("input", function () {
      var t = zoomSlider.value / 100;
      curScale = baseScale * (1 + t * 2);
      clamp();
      apply();
    });

    function pointerDown(e) {
      dragging = true;
      var p = e.touches ? e.touches[0] : e;
      startX = p.clientX; startY = p.clientY;
      startOffX = offsetX; startOffY = offsetY;
    }
    function pointerMove(e) {
      if (!dragging) return;
      var p = e.touches ? e.touches[0] : e;
      offsetX = startOffX + (p.clientX - startX);
      offsetY = startOffY + (p.clientY - startY);
      clamp();
      apply();
      if (e.cancelable) e.preventDefault();
    }
    function pointerUp() { dragging = false; }

    frame.addEventListener("mousedown", pointerDown);
    frame.addEventListener("touchstart", pointerDown, { passive: true });
    window.addEventListener("mousemove", pointerMove);
    window.addEventListener("touchmove", pointerMove, { passive: false });
    window.addEventListener("mouseup", pointerUp);
    window.addEventListener("touchend", pointerUp);

    function cleanup() {
      window.removeEventListener("mousemove", pointerMove);
      window.removeEventListener("touchmove", pointerMove);
      window.removeEventListener("mouseup", pointerUp);
      window.removeEventListener("touchend", pointerUp);
      overlay.remove();
    }

    document.getElementById("cropCancelBtn").addEventListener("click", function () {
      cleanup();
      if (onCancel) onCancel();
    });
    document.getElementById("cropUseBtn").addEventListener("click", function () {
      var outW = aspect === "portrait" ? 720 : (aspect === "landscape" ? 900 : 800);
      var outH = aspect === "portrait" ? 960 : (aspect === "landscape" ? 600 : 800);
      var canvas = document.createElement("canvas");
      canvas.width = outW; canvas.height = outH;
      var ctx = canvas.getContext("2d");
      ctx.imageSmoothingQuality = "high";
      var sx = -offsetX / curScale;
      var sy = -offsetY / curScale;
      var sW = frameW / curScale;
      var sH = frameH / curScale;
      ctx.drawImage(sourceImg, sx, sy, sW, sH, 0, 0, outW, outH);
      var dataUrl = canvas.toDataURL("image/jpeg", 0.78);
      cleanup();
      onDone(dataUrl);
    });
  }

  function wirePasswordToggles(root) {

      if (!u || !p) { showRegisterScreen("Username and password can't be empty."); return; }

      try { sessionStorage.setItem(AUTH_SESSION_KEY, "1"); } catch (e) {}
      loadAppData().then(render);
    }
    document.getElementById("regSubmitBtn").addEventListener("click", attempt);
    document.getElementById("regPasswordConfirm").addEventListener("keydown", function (e) { if (e.key === "Enter") attempt(); });
  }

  function showLoginScreen(errorMsg) {
    var root = document.getElementById("root");
    root.innerHTML = '<div class="login-wrap"><div class="login-card">' +
      stickerCarouselHTML() +
      '<div style="font-size:32px">🎬</div>' +
      '<h1 class="login-title">Haki\'s Archive</h1>' +
      '<p class="login-sub">Private — sign in to view</p>' +
      '<div class="field-wrap" style="text-align:left;margin-bottom:10px">' +
      '<span class="field-label">Username</span>' +
      '<input class="field-input" id="loginUsername" type="text" autocomplete="username">' +
      "</div>" +
      passwordFieldHTML("loginPassword", "Password") +
      '<p class="login-error">' + (errorMsg ? esc(errorMsg) : "") + "</p>" +
      '<button class="save-btn" id="loginSubmitBtn" style="width:100%;margin-top:6px">Unlock</button>' +
      '<p class="login-sub" style="margin-top:14px;font-size:11px">Forgot your password? Clearing this app\'s storage lets you register again — but it will also erase your saved data.</p>' +
      "</div></div>";
    wirePasswordToggles(root);

    function attempt() {
      var admin = getAdminAccount();
      var u = document.getElementById("loginUsername").value.trim();
      var p = document.getElementById("loginPassword").value;
      if (admin && u.toLowerCase() === admin.username.toLowerCase() && p === admin.password) {
        try { sessionStorage.setItem(AUTH_SESSION_KEY, "1"); } catch (e) {}
        restoreLastView();
        loadAppData().then(showMaintenanceScreen);
      } else {
        showLoginScreen("Incorrect username or password.");
      }
    }
    document.getElementById("loginSubmitBtn").addEventListener("click", attempt);
    document.getElementById("loginPassword").addEventListener("keydown", function (e) {
      if (e.key === "Enter") attempt();
    });
  }

  function maintenanceScreenHTML(status, hideCompressBtn) {
    return '<div class="login-wrap"><div class="login-card">' +
      '<div style="font-size:32px">🗜️</div>' +
      '<h1 class="login-title">Quick Maintenance</h1>' +
      '<p style="color:#786646;font-size:13px;margin-bottom:16px">Your archive has grown a lot — compressing your photos can help prevent crashes, especially when saving backups. Same photos, same crop, just a smaller file size. This can take a minute depending on how many photos you have.</p>' +
      (status ? '<p style="color:#9C6B21;font-size:13px;margin-bottom:12px;font-weight:600">' + esc(status) + "</p>" : "") +
      (hideCompressBtn ? "" : '<button type="button" class="save-btn" id="runCompressBtn" style="width:100%;margin-bottom:10px">🗜️ Compress My Photos Now</button>') +
      '<button type="button" class="cancel-btn" id="skipMaintenanceBtn" style="width:100%">' + (hideCompressBtn ? "Continue to Home →" : "Skip → Go to Home") + "</button>" +
      "</div></div>";
  }

  function showMaintenanceScreen() {
    var root = document.getElementById("root");
    root.innerHTML = maintenanceScreenHTML();
    document.getElementById("skipMaintenanceBtn").addEventListener("click", function () { render(); });
    var runBtn = document.getElementById("runCompressBtn");
    if (runBtn) runBtn.addEventListener("click", function () {
      runBtn.disabled = true;
      runBtn.textContent = "Compressing… 0%";
      compressAllPhotos(function (done, total) {
        runBtn.textContent = "Compressing… " + Math.round((done / total) * 100) + "%" + (total ? " (" + done + "/" + total + ")" : "");
      }).then(function (result) {
        persistTitles();
        persistCharacters();
        persistStickers();
        var mb = (result.savedBytes / 1024 / 1024).toFixed(1);
        var msg = result.total === 0 ? "No photos found to compress." : "Done! Freed up about " + mb + " MB across " + result.total + " photo(s).";
        root.innerHTML = maintenanceScreenHTML(msg, true);
        document.getElementById("skipMaintenanceBtn").addEventListener("click", function () { render(); });
      }).catch(function () {
        root.innerHTML = maintenanceScreenHTML("Something went wrong during compression — your data wasn't changed. You can try again or continue to Home.", true);
        document.getElementById("skipMaintenanceBtn").addEventListener("click", function () { render(); });
      });
    });
  }

  function restoreLastView() {
    try {
      var raw = localStorage.getItem(LAST_VIEW_KEY);
      if (!raw) return;
      var v = JSON.parse(raw);
      if (v && v.page) {
        state.page = v.page;
        state.selectedId = v.selectedId || null;
        state.selectedCharId = v.selectedCharId || null;
        state.selectedCastTitleId = v.selectedCastTitleId || null;
        state.selectedCastId = v.selectedCastId || null;
        state.selectedDiaryId = v.selectedDiaryId || null;
      }
    } catch (e) {}
  }

  var alreadyAuthed = false;
  try { alreadyAuthed = sessionStorage.getItem(AUTH_SESSION_KEY) === "1"; } catch (e) {}
  try { state.diaryUnlocked = sessionStorage.getItem(DIARY_UNLOCKED_KEY) === "1"; } catch (e) {}
  idbGet(STICKERS_KEY).catch(function () { return undefined; }).then(function (stickers) {
    state.stickerFaces = stickers || [];
    if (alreadyAuthed) {
      restoreLastView();
      loadAppData().then(showMaintenanceScreen);
    } else if (getAdminAccount()) {
      showLoginScreen();
    } else {
      showRegisterScreen();
    }
  });
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
